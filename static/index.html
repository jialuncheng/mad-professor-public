<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mad Professor</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f5f5f5; height: 100vh; display: flex; }

    /* 左側論文列表 */
    #sidebar {
      width: 260px;
      background: #1e2a3a;
      color: #fff;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    #sidebar h1 {
      padding: 20px 16px;
      font-size: 15px;
      font-weight: 600;
      border-bottom: 1px solid #2e3d50;
      color: #a8c7e8;
      letter-spacing: 0.5px;
    }
    #paper-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    .paper-item {
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 4px;
      transition: background 0.15s;
    }
    .paper-item:hover { background: #2e3d50; }
    .paper-item.active { background: #2563eb; }
    .paper-title-zh {
      font-size: 13px;
      font-weight: 500;
      line-height: 1.4;
      margin-bottom: 4px;
    }
    .paper-title-en {
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .paper-item-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }
    .paper-item-titles { flex: 1; min-width: 0; }
    .delete-btn {
      background: none;
      border: none;
      color: #64748b;
      cursor: pointer;
      font-size: 14px;
      padding: 2px 4px;
      border-radius: 4px;
      flex-shrink: 0;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .paper-item:hover .delete-btn { opacity: 1; }
    .delete-btn:hover { color: #ef4444; background: #1e2a3a; }
    #upload-btn {
      margin: 8px;
      padding: 10px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
    }
    #upload-btn:hover { background: #1d4ed8; }

    /* 中間論文內容 */
    #content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #content-toolbar {
      padding: 12px 20px;
      background: white;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    #content-toolbar h2 {
      font-size: 14px;
      color: #1e293b;
      flex: 1;
    }
    #lang-toggle {
      padding: 6px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: white;
      cursor: pointer;
      font-size: 13px;
      color: #475569;
    }
    #lang-toggle:hover { background: #f1f5f9; }
    #paper-content {
      flex: 1;
      overflow-y: auto;
      padding: 32px 48px;
      background: white;
      max-width: 860px;
      margin: 0 auto;
      width: 100%;
    }
    #paper-content h1 { font-size: 26px; font-weight: 700; color: #1e293b; margin-bottom: 24px; line-height: 1.3; }
    #paper-content h2 { font-size: 20px; font-weight: 600; color: #1e40af; margin: 32px 0 12px; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; }
    #paper-content h3 { font-size: 16px; font-weight: 600; color: #374151; margin: 24px 0 8px; }
    #paper-content p { font-size: 15px; line-height: 1.8; color: #374151; margin-bottom: 16px; }
    #paper-content img { max-width: 100%; border-radius: 8px; margin: 16px 0; }
    #paper-content em { color: #6b7280; font-size: 13px; }
    #paper-content table { border-collapse: collapse; width: 100%; margin: 16px 0; }
    #paper-content td, #paper-content th { border: 1px solid #e2e8f0; padding: 8px 12px; font-size: 14px; }
    #empty-state {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #94a3b8;
      font-size: 15px;
    }
/* 右側 AI 問答 */
    #chat-panel {
      width: 420px;
      background: white;
      border-left: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    #chat-header {
      padding: 14px 16px;
      border-bottom: 1px solid #e2e8f0;
      font-size: 14px;
      font-weight: 600;
      color: #1e293b;
    }
    #chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .msg-user {
      background: #2563eb;
      color: white;
      padding: 12px 16px;
      border-radius: 12px 12px 2px 12px;
      font-size: 14px;
      line-height: 1.6;
      align-self: flex-end;
      max-width: 80%;
      white-space: pre-wrap;
    }
    .msg-ai {
      background: #f8fafc;
      color: #1e293b;
      padding: 14px 16px;
      border-radius: 12px 12px 12px 2px;
      font-size: 14px;
      line-height: 1.8;
      align-self: flex-start;
      max-width: 95%;
      border: 1px solid #e2e8f0;
    }
    .msg-ai p { margin-bottom: 10px; }
    .msg-ai p:last-child { margin-bottom: 0; }
    .msg-ai ul, .msg-ai ol { margin: 8px 0 8px 20px; }
    .msg-ai li { margin-bottom: 4px; }
    #chat-input-area {
      padding: 12px;
      border-top: 1px solid #e2e8f0;
      display: flex;
      gap: 8px;
    }
    #chat-input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      resize: none;
      min-height: 44px;
      max-height: 120px;
      overflow-y: auto;
      outline: none;
    }
    #chat-input:focus { border-color: #2563eb; }
    #send-btn {
      padding: 10px 16px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
    }
    #send-btn:hover { background: #1d4ed8; }
    #send-btn:disabled { background: #94a3b8; cursor: not-allowed; }
    .chat-empty {
      text-align: center;
      color: #94a3b8;
      font-size: 13px;
      margin-top: 40px;
    }
    #confirm-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    #confirm-modal.show { display: flex; }
    #confirm-box {
      background: white;
      border-radius: 12px;
      padding: 28px 32px;
      width: 380px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
    }
    #confirm-box h3 { font-size: 16px; color: #1e293b; margin-bottom: 8px; }
    #confirm-box p { font-size: 13px; color: #64748b; margin-bottom: 20px; }
    #doc-type-select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 8px;
      outline: none;
    }
    #confirm-reason {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 20px;
      font-style: italic;
    }
    #confirm-box-btns { display: flex; gap: 8px; justify-content: flex-end; }
    #confirm-ok-btn {
      padding: 9px 20px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
    }
    #confirm-ok-btn:hover { background: #1d4ed8; }
  </style>
</head>
<body>

<!-- 左側論文列表 -->
<div id="sidebar">
  <h1>📚 論文列表</h1>
  <div id="paper-list"></div>
  <button id="upload-btn">＋ 上傳論文</button>
</div>

<!-- 中間論文內容 -->
<div id="content-area">
  <div id="content-toolbar" style="display:none">
    <h2 id="current-title">論文標題</h2>
    <button id="lang-toggle">切換英文</button>
  </div>
  <div id="empty-state">← 從左側選擇一篇論文</div>
  <div id="paper-content" style="display:none"></div>
</div>

<!-- 文件類型確認框 -->
<div id="confirm-modal">
  <div id="confirm-box">
    <h3>確認文件類型</h3>
    <p id="confirm-desc">AI 偵測到文件類型如下，請確認或修改後繼續處理。</p>
    <select id="doc-type-select">
      <option value="academic">學術論文</option>
      <option value="book">書籍</option>
      <option value="technical">技術文件</option>
      <option value="slides">簡報</option>
      <option value="web">網頁存檔</option>
      <option value="news">新聞文章</option>
    </select>
    <div id="confirm-reason"></div>
    <div id="confirm-box-btns">
      <button id="confirm-ok-btn">確認，開始處理</button>
    </div>
  </div>
</div>

<!-- 右側 AI 問答 -->
<div id="chat-panel">
  <div id="chat-header">🤖 AI 問答</div>
  <div id="chat-messages">
    <div class="chat-empty">選擇論文後開始提問</div>
  </div>
  <div id="chat-input-area">
    <textarea id="chat-input" placeholder="輸入問題（Ctrl+Enter 送出）..." disabled></textarea>
    <button id="send-btn" disabled>送出</button>
  </div>
</div>

<script>
const API = '';
let currentPaperId = null;
let currentLang = 'zh';

// 載入論文列表
async function loadPapers() {
  const res = await fetch(`${API}/api/papers`);
  const papers = await res.json();
  const list = document.getElementById('paper-list');
  list.innerHTML = '';
  papers.forEach(p => {
    const item = document.createElement('div');
    item.className = 'paper-item';
    item.dataset.id = p.id;
    item.innerHTML = `
      <div class="paper-item-header">
        <div class="paper-item-titles">
          <div class="paper-title-zh">${p.translated_title || p.title}</div>
          <div class="paper-title-en">${p.title}</div>
        </div>
        <button class="delete-btn" title="刪除論文">✕</button>
      </div>
    `;
    item.querySelector('.delete-btn').onclick = (e) => {
      e.stopPropagation();
      deletePaper(p.id, p.translated_title || p.title);
    };
    item.onclick = () => loadPaper(p.id, p.translated_title || p.title);
    list.appendChild(item);
  });
}

// 載入論文內容
async function loadPaper(paperId, title) {
  currentPaperId = paperId;

  document.querySelectorAll('.paper-item').forEach(el => {
    el.classList.toggle('active', el.dataset.id === paperId);
  });

  document.getElementById('content-toolbar').style.display = 'flex';
  document.getElementById('current-title').textContent = title;
  document.getElementById('empty-state').style.display = 'none';
  document.getElementById('paper-content').style.display = 'block';
  document.getElementById('paper-content').innerHTML = '<p style="color:#94a3b8">載入中...</p>';

  await fetchContent(paperId, currentLang);
  enableChat();
  await loadChatHistory(paperId);
}

// 取得論文 Markdown 內容
async function fetchContent(paperId, lang) {
  const res = await fetch(`${API}/api/papers/${paperId}/content?lang=${lang}`);
  const data = await res.json();

  // 把圖片路徑換成 API 路徑
  const content = data.content.replace(
    /!\[([^\]]*)\]\(images\/([^)]+)\)/g,
    `![$1](/api/papers/${paperId}/images/$2)`
  );

  document.getElementById('paper-content').innerHTML = marked.parse(content);
}

// 切換語言
document.getElementById('lang-toggle').onclick = async () => {
  currentLang = currentLang === 'zh' ? 'en' : 'zh';
  document.getElementById('lang-toggle').textContent = currentLang === 'zh' ? '切換英文' : '切換中文';
  if (currentPaperId) await fetchContent(currentPaperId, currentLang);
};// 聊天功能
let isStreaming = false;

function enableChat() {
  document.getElementById('chat-input').disabled = false;
  document.getElementById('send-btn').disabled = false;
}

// 載入對話紀錄
async function deletePaper(paperId, title) {
  if (!confirm(`確定要刪除「${title}」嗎？\n此操作無法還原。`)) return;
  try {
    const res = await fetch(`/api/papers/${paperId}`, { method: 'DELETE' });
    if (!res.ok) throw new Error('刪除失敗');
    if (currentPaperId === paperId) {
      currentPaperId = null;
      document.getElementById('content-toolbar').style.display = 'none';
      document.getElementById('empty-state').style.display = 'flex';
      document.getElementById('paper-content').style.display = 'none';
      document.getElementById('chat-messages').innerHTML = '<div class="chat-empty">選擇論文後開始提問</div>';
      document.getElementById('chat-input').disabled = true;
      document.getElementById('send-btn').disabled = true;
    }
    await loadPapers();
  } catch(e) {
    alert('刪除失敗：' + e.message);
  }
}

async function loadChatHistory(paperId) {
  const messages = document.getElementById('chat-messages');
  messages.innerHTML = '';
  try {
    const res = await fetch(`/api/papers/${paperId}/chat/history`);
    const history = await res.json();
    if (!history.length) {
      messages.innerHTML = '<div class="chat-empty">針對論文提問</div>';
      return;
    }
    history.forEach(msg => {
      const div = document.createElement('div');
      if (msg.role === 'user') {
        div.className = 'msg-user';
        div.textContent = msg.content;
      } else {
        div.className = 'msg-ai';
        const formatted = msg.content.replace(/\n(?!\n)/g, '\n\n');
        div.innerHTML = marked.parse(formatted);
      }
      messages.appendChild(div);
    });
    messages.scrollTop = messages.scrollHeight;
  } catch(e) {
    messages.innerHTML = '<div class="chat-empty">針對論文提問</div>';
  }
}

// 儲存對話紀錄
async function saveChatHistory(paperId) {
  const msgs = document.querySelectorAll('#chat-messages .msg-user, #chat-messages .msg-ai');
  const history = Array.from(msgs).map(el => ({
    role: el.classList.contains('msg-user') ? 'user' : 'assistant',
    content: el.classList.contains('msg-user') ? el.textContent : el.innerText
  }));
  try {
    await fetch(`/api/papers/${paperId}/chat/history`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({messages: history})
    });
  } catch(e) {}
}

async function sendMessage() {
  const input = document.getElementById('chat-input');
  const query = input.value.trim();
  if (!query || isStreaming || !currentPaperId) return;

  input.value = '';
  isStreaming = true;
  document.getElementById('send-btn').disabled = true;

  // 顯示用戶訊息
  const messages = document.getElementById('chat-messages');
  const userMsg = document.createElement('div');
  userMsg.className = 'msg-user';
  userMsg.style.whiteSpace = 'pre-wrap';
  userMsg.textContent = query;
  messages.appendChild(userMsg);

  // 建立 AI 訊息泡泡
  const aiMsg = document.createElement('div');
  aiMsg.className = 'msg-ai';
  aiMsg.textContent = '▋';
  messages.appendChild(aiMsg);
  messages.scrollTop = messages.scrollHeight;

  // SSE 串流
  const res = await fetch(`/api/papers/${currentPaperId}/chat`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({query, paper_id: currentPaperId})
  });

  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let accumulated = '';

  while (true) {
    const {done, value} = await reader.read();
    if (done) break;

    const text = decoder.decode(value);
    const lines = text.split('\n');
    for (const line of lines) {
      if (!line.startsWith('data: ')) continue;
      try {
        const chunk = JSON.parse(line.slice(6));
        if (chunk.sentence) {
          accumulated += chunk.sentence;
          // 把單換行轉成 Markdown 段落（兩個換行）
          const formatted = accumulated.replace(/\n(?!\n)/g, '\n\n');
          aiMsg.innerHTML = marked.parse(formatted);
          messages.scrollTop = messages.scrollHeight;
        }
        if (chunk.done) {
          isStreaming = false;
          document.getElementById('send-btn').disabled = false;
          await saveChatHistory(currentPaperId);
        }
      } catch {}
    }
  }
}

document.getElementById('send-btn').onclick = sendMessage;
document.getElementById('chat-input').onkeydown = (e) => {
  if (e.key === 'Enter' && e.ctrlKey) {
    e.preventDefault();
    sendMessage();
  }
};

// 上傳論文
document.getElementById('upload-btn').onclick = () => {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.pdf';
  input.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const btn = document.getElementById('upload-btn');
    btn.textContent = '上傳中...';
    btn.disabled = true;

    const formData = new FormData();
    formData.append('file', file);

    try {
      const res = await fetch('/api/papers/upload', {
        method: 'POST',
        body: formData
      });
      const data = await res.json();
      const paperId = data.paper_id;

      // 開始追蹤進度
      btn.textContent = '處理中...';
      trackProgress(paperId, btn);

    } catch (err) {
      btn.textContent = '＋ 上傳論文';
      btn.disabled = false;
      alert('上傳失敗：' + err.message);
    }
  };
  input.click();
};

// 追蹤處理進度
function trackProgress(paperId, btn) {
  const evtSource = new EventSource(`/api/papers/${paperId}/status`);

  evtSource.onmessage = (e) => {
    const data = JSON.parse(e.data);

    if (data.status === 'processing') {
      const p = data.progress;
      btn.textContent = `${p.stage_name}... ${p.progress}%`;
    } else if (data.status === 'waiting_confirm') {
      evtSource.close();
      btn.textContent = '等待確認...';
      showConfirmModal(paperId, data.detection, btn);
    } else if (data.status === 'done') {
      evtSource.close();
      btn.textContent = '＋ 上傳論文';
      btn.disabled = false;
      loadPapers();  // 重新載入論文列表
    } else if (data.status === 'error') {
      evtSource.close();
      btn.textContent = '＋ 上傳論文';
      btn.disabled = false;
      alert('處理失敗：' + (data.error || '未知錯誤'));
    }
  };

  evtSource.onerror = () => {
    evtSource.close();
    btn.textContent = '＋ 上傳論文';
    btn.disabled = false;
  };
}

// 文件類型確認
const DOC_TYPE_LABELS = {
  academic: '學術論文',
  book: '書籍',
  technical: '技術文件',
  slides: '簡報',
  web: '網頁存檔',
  news: '新聞文章'
};

function showConfirmModal(paperId, detection, btn) {
  const modal = document.getElementById('confirm-modal');
  const select = document.getElementById('doc-type-select');
  const reason = document.getElementById('confirm-reason');
  const desc = document.getElementById('confirm-desc');

  const docType = detection?.doc_type || 'academic';
  const confidence = detection?.confidence || '';
  const detectionReason = detection?.reason || '';

  select.value = docType;
  desc.textContent = `AI 偵測結果：${DOC_TYPE_LABELS[docType] || docType}（信心度：${confidence}）`;
  reason.textContent = detectionReason;

  modal.classList.add('show');

  document.getElementById('confirm-ok-btn').onclick = async () => {
    const selectedType = select.value;
    modal.classList.remove('show');
    btn.textContent = '處理中...';
    btn.disabled = true;

    try {
      await fetch(`/api/papers/${paperId}/confirm_type`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({doc_type: selectedType})
      });
      // 重新追蹤進度
      trackProgress(paperId, btn);
    } catch(e) {
      btn.textContent = '＋ 上傳論文';
      btn.disabled = false;
      alert('確認失敗：' + e.message);
    }
  };
}

loadPapers();
</script>
</body>
</html>
